{% extends 'base.html' %}
{% block content %}
<h4 class="mb-3">🧾 Kasir Persewaan</h4>
<div class="card p-3">
    <form method="POST">
        <div class="mb-2">
            <label>Nama Penyewa</label>
            <input type="text" name="nama" class="form-control" required>
        </div>
        <div class="mb-2">
            <label>No WhatsApp</label>
            <input type="text" name="wa" class="form-control" required>
        </div>
        <div class="mb-2">
            <label>Jaminan (KTP/STNK/Uang)</label>
            <input type="text" name="jaminan" class="form-control" required>
        </div>
        <div class="mb-2">
            <label>Pilih Stroller</label>
            <select name="stroller_id" class="form-select" required>
                {% for s in strollers %}
                <option value="{{ s.id }}">{{ s.nama }} - Rp {{ "{:,.0f}".format(s.harga) }}/hari</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-2">
            <label>Lama Sewa (Hari)</label>
            <input type="number" name="lama" class="form-control" value="1" required>
        </div>
        <div class="mb-3">
            <label>Deposit (Opsional)</label>
            <input type="number" name="deposit" class="form-control" value="0">
        </div>
        <button type="submit" class="btn btn-primary w-100">Simpan & Cetak Nota</button>
    </form>
</div>
{% endblock %}
