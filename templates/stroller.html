{% extends 'base.html' %}
{% block content %}
<h4 class="mb-3">🍼 Daftar Stroller</h4>
<div class="card p-3 mb-3">
    <form method="POST" class="d-flex gap-2">
        <input type="text" name="nama" class="form-control" placeholder="Nama Stroller" required>
        <input type="number" name="harga" class="form-control" placeholder="Harga/Hari" required>
        <button type="submit" class="btn btn-primary">Tambah</button>
    </form>
</div>
<ul class="list-group">
    {% for s in strollers %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <div>
            <b>{{ s.nama }}</b><br>
            <span class="text-muted">Rp {{ "{:,.0f}".format(s.harga) }}/hari</span>
        </div>
        <a href="/hapus_stroller/{{ s.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Hapus stroller ini?')">Hapus</a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
